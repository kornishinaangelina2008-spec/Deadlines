<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дедлайны группы</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        h1 { color: #2c3e50; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
        .overdue { border-color: #e74c3c; background: #fdecea; }
        .soon { border-color: #f39c12; background: #fef5e7; }
        .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; }
        .badge-red { background: #e74c3c; }
        .badge-orange { background: #f39c12; }
        .badge-green { background: #27ae60; }
        a.btn { display: inline-block; padding: 8px 16px; background: #3498db; color: #fff; text-decoration: none; border-radius: 6px; }
        .del { color: #e74c3c; text-decoration: none; font-size: 14px; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
